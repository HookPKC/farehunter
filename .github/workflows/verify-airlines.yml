name: Verify Airlines

on:
  schedule:
    - cron: "0 7 * * *"       # 每日 07:00 UTC（台灣 15:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farehunter
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Sync to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main
          git checkout -B main refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main
          test -z "$(git status --porcelain)" || {
            echo "Working tree is not clean before data collection"
            git status --short
            exit 1
          }
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse refs/remotes/origin/main)"
          echo "Synced main: ${LOCAL_SHA}"
          test "${LOCAL_SHA}" = "${REMOTE_SHA}" || {
            echo "HEAD is not equal to origin/main before API execution"
            exit 1
          }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify board cheap days with real airline prices
        env:
          SCRAPEDO_KEY: ${{ secrets.SCRAPEDO_KEY }}
        run: PYTHONPATH=src python -m farehunter.verify_airlines
      - name: Export dashboard data
        run: python src/farehunter/export_web.py prices.db docs/data.json
      # 順序是關鍵：verify 寫入實價 → export 重算看板（那個日期的 source 變成
      # google）→ 這一步才推得出「實價背書」的便宜日。放到 export 之前的話
      # 看板上還是快取估價，一則都不會合格。
      #
      # 也刻意放在 Commit 之前：推播會寫 cheap_day_notices 去重紀錄到
      # prices.db，那筆必須跟著這輪一起 commit，否則下次跑會重推同一天。
      - name: Notify verified cheap days
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python -m farehunter.cheap_day_notify prices.db docs/data.json
      - name: Commit
        run: |
          git config user.name "farehunter-bot"
          git config user.email "bot@users.noreply.github.com"
          set -euo pipefail
          BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          git add prices.db docs/data.json docs/verify-report.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: airline verify $(date -u +'%Y-%m-%dT%H:%MZ')"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if git push origin HEAD:main; then
            echo "Push succeeded: ${LOCAL_SHA}"
          else
            echo "Initial push did not return success; checking remote state"
            git fetch --no-tags --prune --depth=1 origin \
              +refs/heads/main:refs/remotes/origin/main
            REMOTE_SHA="$(git rev-parse refs/remotes/origin/main)"
            if [ "${REMOTE_SHA}" = "${LOCAL_SHA}" ]; then
              echo "Push already reached remote; treating run as successful"
            elif [ "${REMOTE_SHA}" = "${BASE_SHA}" ]; then
              echo "Remote did not advance; retrying the same push once after backoff"
              sleep 5
              git push origin HEAD:main
            else
              echo "NON-FAST-FORWARD: refusing to merge binary prices.db"
              echo "workflow=${GITHUB_WORKFLOW}"
              echo "run_id=${GITHUB_RUN_ID}"
              echo "base=${BASE_SHA}"
              echo "local=${LOCAL_SHA}"
              echo "remote=${REMOTE_SHA}"
              exit 1
            fi
          fi
