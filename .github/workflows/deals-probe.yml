name: Deals Probe

# 一次性探測，只有手動觸發。
#
# 目的：搞清楚 SerpAPI 的 google_flights_deals 引擎在 Free Plan 上能不能用、
# 回應長什麼樣、以及**一次查詢扣幾次額度**。第三項只能實際打一次才知道
# （Scrape.do 就是一次扣 10 credits，不能假設 1 次 = 1 次）。
#
# 成本：恰好 1 次 SerpAPI 搜尋（月額度 250）。前後各打一次 account.json
# 來量測真實扣款——那個端點免費、不計額度。
#
# 唯讀：不寫 commit、不碰 prices.db、不碰 docs/。
#
# 探測完、決定要不要接 deals 之後，這個 workflow 和 src/farehunter/deals_probe.py
# 都可以刪掉——它們的產出是一份判斷依據，不是長期執行的功能。

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "出發地 IATA（預設 TPE）"
        required: false
        default: "TPE"
      destination:
        description: "目的地 IATA（預設 NRT）"
        required: false
        default: "NRT"

permissions:
  contents: read

concurrency:
  group: deals-probe
  cancel-in-progress: false     # 探測會花額度，不要因為併發被砍到一半

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe google_flights_deals
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          set -uo pipefail
          PYTHONPATH=src python -m farehunter.deals_probe \
            "${{ inputs.origin }}" "${{ inputs.destination }}" \
            2>&1 | tee "${RUNNER_TEMP}/probe.txt"
          {
            echo "## google_flights_deals 探測結果"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/probe.txt"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
