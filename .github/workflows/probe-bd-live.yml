name: TEMP live run with Bright Data

# TEMP（合併前刪除）：用分支上的正式程式跑一輪 monitor（含 Bright Data 警報驗證與巡檢），
# 不發 LINE／Telegram（不帶那些 secret）、不 commit 資料庫，只印結果。

on:
  push:
    branches: [claude/funny-thompson-pu3xyg]
    paths: [".github/workflows/probe-bd-live.yml"]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run monitor once (no notifications, no commit)
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          FAREHUNTER_FORCE: "1"
        run: |
          start=$(date +%s)
          python run.py 2>&1 | grep -E "Bright Data|Run summary|ERROR|Traceback|Error" | cut -c1-600
          echo "elapsed_seconds=$(( $(date +%s) - start ))"
      - name: What Bright Data wrote
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("prices.db")
          print("api_usage:", c.execute("select * from api_usage").fetchall())
          rows = c.execute("""select origin||'-'||destination, depart_date, return_date, price, carriers
                              from observations where provider='brightdata' order by 1, 2""").fetchall()
          print("brightdata rows:", len(rows))
          for r in rows: print("  ", r)
          print("alerts this run:", c.execute("select origin, destination, depart_date, price, price_status from alerts where sent_at >= datetime('now','-1 hour')").fetchall())
          PY
