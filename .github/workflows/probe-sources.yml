name: TEMP probe keyless sources

# TEMP（合併前刪除）：實測 Kiwi 網站日曆、Skyscanner 月曆、捷星 farecache、星宇月曆，
# 跟同一輪 fli 日曆比對。見 probe/sources_probe.py。

on:
  push:
    branches: [claude/funny-thompson-pu3xyg]
    paths: [".github/workflows/probe-sources.yml", "probe/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-fli.txt
      - name: Probe keyless sources
        run: |
          set -o pipefail
          PYTHONPATH=src python probe/sources_probe.py | tee probe.json
          { echo '## keyless sources probe'; echo '```json'; cat probe.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
