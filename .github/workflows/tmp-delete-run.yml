name: TEMP delete leaked probe run

# TEMP（跑完即刪）：刪除 run 41181112197（Bright Data 探測，曾印出 zone 密碼；紀錄已刪，
# 這裡把整個 run 連同摘要一起刪掉）。只用 GitHub 內建權杖、只要 actions: write，不碰任何 secret。

on:
  push:
    branches: [claude/funny-thompson-pu3xyg]
    paths: [".github/workflows/tmp-delete-run.yml"]

permissions:
  actions: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete run 41181112197
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/41181112197" --silent && echo "delete request: ok"
          if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/41181112197" --silent 2>/dev/null; then
            echo "run still exists"; exit 1
          else
            echo "confirmed: run is gone"
          fi
