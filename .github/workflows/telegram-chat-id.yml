name: Telegram chat id（一次性）

# 一次性小工具：用 TELEGRAM_BOT_TOKEN 找到你跟 bot 的私訊對話，直接在 Telegram 傳一則
# 「你的 chat id 是 ⋯」給你。repo 是公開的，Actions 紀錄任何人都看得到，所以這裡
# 絕不印出 token 或 chat id，只印「成功／失敗原因」。存好 TELEGRAM_CHAT_ID 之後刪掉這個檔案。

on:
  workflow_dispatch:

permissions: {}

jobs:
  chat-id:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 把 chat id 傳到你的 Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: python
        run: |
          import json, os, sys, urllib.error, urllib.request

          tok = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not tok:
              print("❌ 還沒設 TELEGRAM_BOT_TOKEN secret")
              sys.exit(1)

          def call(method, payload=None):
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{tok}/{method}",
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, None
              except Exception as e:                       # 不印訊息原文（可能帶網址）
                  print(f"❌ 連不到 Telegram：{type(e).__name__}")
                  sys.exit(1)

          status, me = call("getMe")
          if status == 401:
              print("❌ token 不對（401）：回 BotFather 按 Copy，重新存一次 TELEGRAM_BOT_TOKEN")
              sys.exit(1)
          if status == 404:
              print("❌ token 格式不對（404）：可能多了引號、空格或少複製了幾個字，重新存一次")
              sys.exit(1)
          if status != 200 or not (me or {}).get("ok"):
              print(f"❌ getMe 失敗：HTTP {status}")
              sys.exit(1)
          print("✅ token 有效")

          status, upd = call("getUpdates")
          if status == 409:
              print("❌ 這個 bot 設了 webhook，getUpdates 不能用")
              sys.exit(1)
          if status != 200 or not (upd or {}).get("ok"):
              print(f"❌ getUpdates 失敗：HTTP {status}")
              sys.exit(1)
          chats = []
          for u in upd.get("result") or []:
              msg = u.get("message") or u.get("edited_message") or {}
              chat = msg.get("chat") or {}
              if chat.get("type") == "private" and chat.get("id") is not None:
                  chats.append(chat["id"])
          if not chats:
              print("❌ bot 還沒收到你的訊息：在 Telegram 對你的 bot 傳一句話，再跑一次")
              sys.exit(1)
          print(f"找到 {len(set(chats))} 個私訊對話，用最新的那個")
          chat_id = chats[-1]

          text = (f"你的 TELEGRAM_CHAT_ID 是：\n{chat_id}\n\n"
                  "把這串數字存到 GitHub repo 的 secret「TELEGRAM_CHAT_ID」。"
                  "（FareHunter 一次性小工具）")
          status, sent = call("sendMessage", {"chat_id": chat_id, "text": text})
          if status != 200 or not (sent or {}).get("ok"):
              print(f"❌ 傳訊息失敗：HTTP {status}")
              sys.exit(1)
          print("✅ 已傳到 Telegram，打開你的 bot 看那則訊息")
