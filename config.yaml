# FareHunter v1.1 — 監控路線設定（資料來源：Travelpayouts / Aviasales 快取）
defaults:
  currency: twd
  months_ahead: 10          # 監控當月起共 10 個月（涵蓋年底旺季＋明年春季賞櫻）
  one_way: false            # false = 來回票價
  non_stop: true            # 台日全直飛航線，轉機票不切實際
  drop_pct: 25              # 低於中位數 25% 觸發
  min_history: 30           # 累積 30 筆觀察後才啟用統計規則
  pause_seconds: 0.6
  # market: 不要設——2026-10 實測 12 個市場結果完全相同、對冷門線沒有幫助（ADR 0003）

routes:
  - origin: TPE
    destination: NRT
    absolute_threshold: 7000    # TWD 來回，第一天就能用的絕對門檻
  - origin: TPE
    destination: KIX
    absolute_threshold: 6500
  - origin: KHH
    destination: NRT
    absolute_threshold: 7500    # 原 8000 → 2026-11-20 用 Google 實價重算（見下方說明）
  - origin: KHH
    destination: KIX
    absolute_threshold: 7500
  # 以下四條線的門檻原本設在「史上最低觀測價」之下，absolute 規則永遠不可能
  # 觸發（KHH→FUK 門檻 7,000，但 5 週內最便宜只到 10,375）。它們原本只靠
  # big_drop 撐著，而那正是 2026-08 修掉的噪音——等於一邊收不到有用通知，
  # 一邊被無用通知洗版。
  #
  # 新門檻的推導方式：不是猜預算，而是對齊「四條正常航線的實際通知頻率」
  # （每月 2–10 次）。取每月約 2–3 次的價位，資料為 2026-07-03~08-09 的觀測。
  # 一個月後資料量翻倍時應重算——目前遠期出發日還沒經歷「越接近越降價」。
  #
  # 2026-11-09 重算（同一方法）：用 2026-10-10~11-09 的直飛來回快取價，模擬每個門檻下
  # 30 天會發幾次（含「同一趟 30 天內只發一次、除非再便宜 10%」的去重）。模擬在現行
  # 門檻下跟實際發出的次數吻合（OKA 12/12、CTS 3/3、NGO 1/1、FUK 2/3）。結果：
  #   OKA：8,200 每月約 12 次（目標 3 次）——進入淡季後門檻跟普通價格差不多，約一半的
  #        直飛來回價都低於它 → 改成 6,500（每月約 2 次；6,600 就跳到 4 次）。
  #   CTS、FUK：每月約 3、2 次，仍在目標上，不改。
  #   NGO：快取 30 天只有 1 個去回日組合，資料不足以校準，不改。
  # 門檻跟季節有關（旺季時 6,500 可能很少觸發，那時靠 big_drop），每季用同一方法重算。
  #
  # 2026-11-20 改用 Google 直飛實價重算（四條冷門線＋KHH-NRT）：11/13～11/19 實際發出 23 則，
  # FUK 9、OKA 8（目標每條線每月 2–3 則），LINE 額度一天掉約 8 則。原因是門檻用快取價定的，
  # 12 月的直飛實價遠低於門檻（虎航飛福岡 7,000–8,000，門檻 12,300），幾乎每趟都觸發。
  # 方法：Bright Data／ChocoData／google-flights2 寫入的 Google 直飛 'any' 實價（住 2–10 晚、出發
  # 至少 2 天後），照警報的去重（同一趟同航空 30 天一次，除非再便宜 10%）逐筆重播，11/09 起
  # 與 11/13 起兩種起算點換算每月則數。實價 10 月底才多起來、11/13 起查詢密度又多了 5–10 倍，
  # 所以只用這兩週，不往前拉長。結果（每月則數，舊門檻 → 新門檻）：
  #   OKA 6,500 約 27–35 → 5,000 約 3–4（觸發價：虎航 4,915）
  #   FUK 12,300 約 82–121 → 7,100 約 3–4（虎航 7,081）
  #   NGO 11,100 約 27–30 → 7,700 約 5–9（虎航 7,610；10 天內兩則是同一週的同一波低價）
  #   CTS 14,200 約 11–13 → 12,000 約 3–4（虎航 11,590）
  #   NRT 8,000 約 30–43 → 7,500 約 0–3（捷星多趟擠在 7,539–7,548，要跌破才觸發）
  # 代價：門檻照 12 月價格定，1–3 月出發（FUK 1 月最便宜 10,281）幾乎不會觸發，那段靠
  # big_drop。資料只有兩週，2026-12-14 用約 6 週資料再算一次，屆時評估要不要依出發月份分別設門檻。
  # 四條冷門線都開 sweep_alerts：警報一律以 Google 直飛實價為準，跟上面的模擬一致。
  - origin: KHH
    destination: CTS      # 札幌新千歲
    absolute_threshold: 12000   # 原 10000 → 14200（快取價）→ 2026-11-20 實價重算 12000
    sweep_alerts: true
  - origin: KHH
    destination: FUK      # 福岡
    absolute_threshold: 7100    # 原 7000 → 12300（快取價）→ 2026-11-20 實價重算 7100
    sweep_alerts: true
  - origin: KHH
    destination: OKA      # 沖繩那霸
    absolute_threshold: 5000    # 原 6000 → 8200 → 6500（快取價）→ 2026-11-20 實價重算 5000
    sweep_alerts: true          # 巡檢查到的 Google 直飛實價 ≤ 門檻也發警報（2026-11-16 起；門檻用實價重算過的航線才開）
  - origin: KHH
    destination: NGO      # 名古屋中部
    absolute_threshold: 7700    # 原 7500 → 11100（快取價）→ 2026-11-20 實價重算 7700
    sweep_alerts: true
